                cuartaSeccion.style.fontSize='13px';
                cuartaSeccion.style.lineHeight="26px"
                cuartaSeccion.style.display='flex';
                cuartaSeccion.style.justifyContent='start';
                cuartaSeccion.style.alignItems='start';

                cuartaSeccion.style.border='1px solid black';
                cuartaSeccion.style.borderTop='none';

                cuadro.appendChild(cuartaSeccion);


                const quintaSeccion=document.createElement('div');
